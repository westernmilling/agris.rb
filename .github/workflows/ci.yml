name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Split from lint deliberately: a spec failure and a lint failure are
  # different problems, and each reports its own status check.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads .ruby-version so CI and local dev cannot drift apart.
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Run specs
        run: |
          bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out tmp/test-results/rspec.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: tmp/test-results/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop
